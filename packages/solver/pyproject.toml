[project]
name = "planning-solver"
version = "0.1.0"
description = "Moteur d'optimisation (OR-Tools CP-SAT) isolé du reste de l'application"
requires-python = ">=3.9"
dependencies = ["ortools>=9.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["planning_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests de correction par défaut ; les mesures de temps (perf) s'exécutent à part : scripts/ops/perf_engine.sh (conditions consignées)
addopts = "-m 'not perf'"
markers = ["perf: mesures de performance (durées), exécutées à part dans des conditions documentées"]
